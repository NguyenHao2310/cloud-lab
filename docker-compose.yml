services:
  backend:
    build: ./mern-demo/server # 👈 Thêm mern-demo/ vào trước server
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
    restart: unless-stopped

  frontend:
    build:
      context: ./mern-demo/client
    container_name: mern-frontend
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
