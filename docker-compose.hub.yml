services:
  backend:
    image: haonguyen2310/mern-backend:latest
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      # Đọc từ file .env (đã được .gitignore) — không hard-code chuỗi kết nối vào compose
      - MONGODB_URI=${MONGODB_URI}
      - PORT=5000
    restart: unless-stopped

  frontend:
    image: haonguyen2310/mern-frontend:latest
    container_name: mern-frontend
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
