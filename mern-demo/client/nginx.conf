server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ của Docker: tìm container theo tên service mỗi khi có request
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Mọi request /api/... chuyển tiếp sang container backend (port 5000)
    location /api/ {
        set $backend_api http://backend:5000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React (SPA): đường dẫn không phải file tĩnh thì trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
