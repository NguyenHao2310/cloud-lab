server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dùng DNS của container để phân giải backend và cập nhật khi IP thay đổi.
    resolver ${DNS_RESOLVERS} valid=30s ipv6=off;

    # Giữ nguyên đường dẫn /api/ khi chuyển sang backend.
    location /api/ {
        set $backend_origin "${BACKEND_URL}";
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Render Free có thể cần khoảng một phút để đánh thức backend.
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # React (SPA): đường dẫn không phải file tĩnh thì trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
